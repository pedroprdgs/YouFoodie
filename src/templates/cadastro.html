{% extends "base.html" %}

{% block title %}YouFoodie - Cadastro{% endblock %}

{% block content %}
<div class="login-container">
    <div class="cadastro-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="YouFoodie" class="login-logo">
            <h2 class="mt-3">Criar conta</h2>
            <p class="text-muted">Cadastre-se para aproveitar nossos serviços</p>
        </div>
        <form method="post">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" name="primeiro_nome" class="form-control" required>
                        <label class="required-label" for="primeiro_nome">Primeiro Nome</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" name="ultimo_nome" class="form-control">
                        <label for="ultimo_nome">Último Nome</label>
                    </div>
                </div>
            </div>
            <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" required>
                <label class="required-label" for="email">Email</label>
            </div>
            <div class="form-floating mb-3">
                <input type="text" name="cpf" maxlength="14" class="form-control" required>
                <label class="required-label" for="cpf">CPF</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" name="senha" class="form-control" required>
                <label class="required-label" for="senha">Senha</label>
            </div>
            <hr class="my-4">
            <h5 class="mb-3">Endereço</h5>
            <div class="form-floating mb-3">
                <input type="text" name="pais" value="Brasil" class="form-control" readonly>
                <label class="required-label" for="pais">País</label>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <div class="form-floating">
                        <input type="text" id="cep" name="cep" class="form-control" required>
                        <label class="required-label" for="cep">CEP</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-floating">
                        <input type="text" id="estado" name="estado" class="form-control" required>
                        <label class="required-label" for="estado">Estado</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-floating">
                        <input type="text" id="cidade" name="cidade" class="form-control" required>
                        <label class="required-label" for="cidade">Cidade</label>
                    </div>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-9">
                    <div class="form-floating">
                        <input type="text" id="rua" name="rua" class="form-control" required>
                        <label class="required-label" for="rua">Rua</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-floating">
                        <input type="number" name="numero" class="form-control" required>
                        <label class="required-label" for="estado">Número</label>
                    </div>
                </div>
            </div>
            <input type="submit" value="Criar Conta" class="btn btn-foodie-large w-100 py-2 mb-3">
            <div class="text-center">
                Já possui conta? <a href="/login">Entrar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
