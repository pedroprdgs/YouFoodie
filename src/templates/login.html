{% extends "base.html" %}

{% block title %}YouFoodie - Login{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="YouFoodie" class="login-logo">
            <h2 class="mt-3">Bem Vindo!</h2>
            <p class="text-muted">Entre para acessar sua conta</p>
        </div>
        <form method="post">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" name="email" required>
                <label for="email">Email</label>
            </div>
            <div class="form-floating mb-3">
                <input type="senha" class="form-control" name="senha" required>
                <label for="senha">Senha</label>
            </div>
            <input type="submit" value="Entrar" class="btn btn-foodie-large w-100 py-2 mb-3">
            <div class="text-center">
                Não possui conta? <a href="/cadastro">Cadastre-se</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
