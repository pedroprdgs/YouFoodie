<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YouFoodie{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
            <div class="container">
                <a href="/" class="navbar-brand d-flex align-items-center gap-2 fw-bold">
                    <img src="{{ url_for('static', filename='assets/logo.png') }}" width="180" alt="Logo">
                </a>

                <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                        <li class="nav-item ms-3"><a href="#" class="btn btn-foodie"><i class="bi bi-basket2-fill fs-3"></i></a></li>
                        <li class="nav-item ms-3"><a href="#" class="btn btn-foodie"><i class="bi bi-person-fill fs-3"></i></a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <main class="container py-4">
            {% block content %}{% endblock %}
        </main>
        <footer class="bg-white border-top mt-5">
            <div class="container py-4 d-flex flex-column flex-md-row justify-content-between align-items-center">
                <p class="mb-2 mb-md-0 text-muted">
                    &copy 2026 YouFoodie
                </p>
                <div class="d-flex gap-3">
                    <a href="" class="text-dark">
                        <i class="bi bi-instagram fs-5"></i>
                    </a>
                    <a href="" class="text-dark">
                        <i class="bi bi-twitter-x fs-5"></i>
                    </a>
                    <a href="" class="text-dark">
                        <i class="bi bi-github fs-5"></i>
                    </a>
                </div>
            </div>
        </footer>
    </body>
</html>
