<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YouFoodie{% endblock %}</title>
    <script src="{{ url_for('static', filename='scripts/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/viacep.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/pratos.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/addcart.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.ico') }}">
</head>
    <body class="bg-light">
        <nav class="navbar bg-white shadow-sm sticky-top">
            <div class="container d-flex justify-content-between align-items-center">
                <a href="/" class="navbar-brand">
                    <img src="{{ url_for('static', filename='assets/logo.png') }}" width="180" alt="Logo">
                </a><div class="d-flex align-items-center gap-3">
                    <a href="{{ '/carrinho' if session.get('usuario_id') else '/login' }}" class="btn btn-foodie"><i class="bi bi-basket2-fill fs-3"></i></a>
                    <a href="{{ '/perfil' if session.get('usuario_id') else '/login' }}" class="btn btn-foodie"><i class="bi bi-person-fill fs-3"></i></a>
                </div>
            </div>
        </nav>
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
            <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
                {% for tipo, mensagem in mensagens %}
                    <div class="toast align-items-center text-bg-{{ tipo }} border-0" role="alert">
                        <div class="d-flex">
                            <div class="toast-body">{{ mensagem }}</div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                        </div>
                    </div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}
        <main class="container py-4">
            {% block content %}{% endblock %}
        </main>
        <footer class="bg-white border-top mt-5">
            <div class="container py-4 d-flex flex-column flex-md-row justify-content-between align-items-center">
                <p class="mb-2 mb-md-0 text-muted">
                    &copy 2026 YouFoodie
                </p>
                <div class="d-flex gap-3">
                    <a href="https://www.instagram.com/pedroprdgs/" target="_blank" class="text-dark">
                        <i class="bi bi-instagram fs-5"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/pedro-rodrigues-aa7001274/" target="_blank" class="text-dark">
                        <i class="bi bi-linkedin fs-5"></i>
                    </a>
                    <a href="https://www.github.com/pedroprdgs" target="_blank" class="text-dark">
                        <i class="bi bi-github fs-5"></i>
                    </a>
                </div>
            </div>
        </footer>
    </body>
</html>
