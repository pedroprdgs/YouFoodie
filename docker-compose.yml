services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

      - ./sql:/docker-entrypoint-initdb.d
  flask:
    build: .
    container_name: flask
    ports: 
      - "5000:5000"
    depends_on:
      - mysql
    volumes:
      - .:/app
volumes:
  mysql_data: